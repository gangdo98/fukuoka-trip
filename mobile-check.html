<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mobile check (temporary)</title>
<style>
  body{margin:0;background:#5b5b5b;font:12px/1.4 sans-serif;color:#fff}
  .bar{position:sticky;top:0;height:0}
  iframe{width:390px;height:9200px;border:0;display:block;margin:0 auto;background:#fff}
</style>
</head>
<body>
<iframe id="f" src="./index.html#shopping" title="390px preview"></iframe>
<script>
  window.__errs = [];
  var f = document.getElementById('f');
  f.addEventListener('load', function () {
    var w = f.contentWindow;
    w.addEventListener('error', function (e) { window.__errs.push('error: ' + e.message); });
    var ce = w.console.error;
    w.console.error = function () { window.__errs.push('console.error: ' + [].join.call(arguments, ' ')); ce.apply(w.console, arguments); };
    var cw = w.console.warn;
    w.console.warn = function () { window.__errs.push('console.warn: ' + [].join.call(arguments, ' ')); cw.apply(w.console, arguments); };
  });
  window.__report = function () {
    var d = f.contentDocument;
    var root = d.documentElement;
    var over = [];
    d.querySelectorAll('body *').forEach(function (e) {
      var r = e.getBoundingClientRect();
      if (r.width > 0 && r.right > 390.5) over.push(e.tagName + '.' + (e.className || '') + ' right=' + Math.round(r.right));
    });
    return {
      viewport: f.contentWindow.innerWidth,
      docScrollWidth: root.scrollWidth,
      docClientWidth: root.clientWidth,
      bodyScrollWidth: d.body.scrollWidth,
      horizontalOverflow: root.scrollWidth > root.clientWidth,
      overflowing: over.slice(0, 25),
      overflowCount: over.length,
      errors: window.__errs,
      rendered: {
        babyGroups: d.querySelectorAll('.babygroup').length,
        babyItems: d.querySelectorAll('.baby__item').length,
        taxFreeBoxes: d.querySelectorAll('.taxfree').length,
        weights: d.querySelectorAll('.weight-list li').length,
        luggage: d.querySelectorAll('.lug').length,
        links: d.querySelectorAll('.reflink').length,
        checklist: d.querySelectorAll('#packList li').length,
        days: d.querySelectorAll('.day').length
      },
      textOverlap: (function () {
        // 겹침 의심: 같은 카드 안에서 형제 블록의 사각형이 세로로 겹치는 경우
        var bad = [];
        d.querySelectorAll('.stop__card, .baby__item, .store, .lug, .taxfree, .weight-card').forEach(function (card) {
          var kids = [].filter.call(card.children, function (k) { return k.getBoundingClientRect().height > 0; });
          for (var i = 1; i < kids.length; i++) {
            var a = kids[i - 1].getBoundingClientRect(), b = kids[i].getBoundingClientRect();
            if (b.top < a.bottom - 0.6) bad.push((card.className || card.tagName) + ': ' + kids[i - 1].className + ' / ' + kids[i].className);
          }
        });
        return bad.slice(0, 10);
      })()
    };
  };
</script>
</body>
</html>
