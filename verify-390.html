<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>390px 검증용 (임시)</title>
<style>
  html,body{margin:0;background:#cfcfcf;font:12px/1.4 -apple-system,sans-serif;color:#333}
  .row{display:flex;gap:10px;padding:10px;align-items:flex-start}
  figure{margin:0;width:390px}
  figcaption{font-weight:700;margin-bottom:6px}
  iframe{width:390px;height:844px;border:1px solid #888;background:#fff;display:block}
</style>
</head>
<body>
<div class="row">
  <figure><figcaption>항공·숙소 — 좌석 배정</figcaption><iframe id="fa" src="./index.html?v=20261125d#booking" title="booking"></iframe></figure>
  <figure><figcaption>쇼핑·포장 — 위탁 4원칙</figcaption><iframe id="fb" src="./index.html?v=20261125d#shopping" title="shopping"></iframe></figure>
  <figure><figcaption>출국가방 — 지정석 배정 완료</figcaption><iframe id="fc" src="./index.html?v=20261125d#departure" title="departure"></iframe></figure>
</div>
<script>
  // 390px 뷰포트 안에서 검증 대상 위치로만 스크롤한다(임시 검증용).
  var n = 0;
  var timer = setInterval(function () {
    n++;
    var b = document.getElementById('fb').contentWindow;
    var c = document.getElementById('fc').contentWindow;
    var okB = false, okC = false;
    try {
      var bag = b.document.getElementById('shopBaggage');
      if (bag) {
        b.scrollTo(0, bag.getBoundingClientRect().top + b.scrollY - 56);
        okB = true;
      }
      var rows = c.document.querySelectorAll('.dep__row');
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].textContent.indexOf('32B / 32C 배정 완료') > -1) {
          c.scrollTo(0, rows[i].getBoundingClientRect().top + c.scrollY - 150);
          okC = true;
          break;
        }
      }
    } catch (e) {}
    if ((okB && okC) || n > 60) clearInterval(timer);
  }, 250);
</script>
</body>
</html>
