<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>390px 검증용 (임시)</title>
<style>
  html,body{margin:0;background:#cfcfcf;font:12px/1.4 -apple-system,sans-serif;color:#333}
  .row{display:flex;gap:10px;padding:10px;align-items:flex-start}
  figure{margin:0;width:390px}
  figcaption{font-weight:700;margin-bottom:6px}
  iframe{width:390px;height:1100px;border:1px solid #888;background:#fff;display:block}
</style>
</head>
<body>
<div class="row">
  <figure>
    <figcaption id="cap">390px</figcaption>
    <iframe id="f" src="./?v=20261126d#shopping" title="390"></iframe>
  </figure>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const target = q.get('t');
  const hash = q.get('h') || 'shopping';
  const frame = document.getElementById('f');
  document.getElementById('cap').textContent = '390px · ' + hash + (target ? ' / ' + target : '');
  frame.src = './?v=' + (q.get('v') || '20261126d') + '#' + hash;
  frame.addEventListener('load', () => {
    const d = frame.contentDocument;
    const w = frame.contentWindow;
    const go = () => {
      if (!target) return;
      const el = d.getElementById(target);
      if (!el) return;
      w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY - 8);
    };
    setTimeout(go, 300);
    setTimeout(go, 1200);
  });
</script>
</body>
</html>
