<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390px 검증</title>
<style>
  html,body{margin:0;padding:0;background:#777}
  iframe{display:block;width:390px;height:960px;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="f" src="index.html" title="390px 검증 프레임"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  const tab = q.get('tab');
  const y = Number(q.get('y') || 0);
  if (tab) f.src = 'index.html#' + tab;
  f.addEventListener('load', () => {
    if (!y) return;
    setTimeout(() => { try { f.contentWindow.scrollTo(0, y); } catch (e) {} }, 500);
  });
</script>
</body>
</html>
